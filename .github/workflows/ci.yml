name: Browser smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser smoke tests
        run: npm test
