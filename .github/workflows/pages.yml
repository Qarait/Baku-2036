name: Pages deploy

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  smoke:
    name: Gate deployment with Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser smoke tests
        run: npm test

  deploy:
    name: Publish Pages artifact
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify generated language entry points
        run: |
          node scripts/build-language-entrypoints.js
          git diff --exit-code -- en/index.html tr/index.html
      - name: Verify Pages artifact contract
        shell: pwsh
        run: pwsh -File tests/pages-artifact-contract.ps1
      - name: Verify official-plan data contract
        shell: pwsh
        run: pwsh -File tests/official-plan-contract.ps1
      - name: Verify administrative GeoJSON derivative
        shell: pwsh
        run: pwsh -File tests/admin-geojson-contract.ps1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build preview artifact
        if: github.ref_name == 'preview'
        run: |
          mkdir -p .pages-main
          mkdir -p dist/preview
          git archive origin/main | tar -x -C .pages-main
          rsync -a --delete --exclude-from=.pagesignore .pages-main/ dist/
          rsync -a --delete --exclude-from=.pagesignore ./ dist/preview/
          rm -rf .pages-main
      - name: Build live artifact
        if: github.ref_name == 'main'
        run: |
          mkdir dist
          rsync -a --delete --exclude-from=.pagesignore ./ dist/
          preview_source=$(mktemp -d)
          git archive origin/preview | tar -x -C "$preview_source"
          mkdir -p dist/preview
          rsync -a --delete --exclude-from=.pagesignore "$preview_source/" dist/preview/
      - name: Verify both published sites
        shell: bash
        run: |
          for site in dist dist/preview; do
            for file in index.html v3.js v3.css data/zones.json en/index.html tr/index.html how-to.html assets/how-to-use.webm THIRD_PARTY_NOTICES.md; do
              test -s "$site/$file" || { echo "Missing published file: $site/$file"; exit 1; }
            done
            for excluded in .git .github docs scripts tests research package.json; do
              test ! -e "$site/$excluded" || { echo "Private/development path in artifact: $site/$excluded"; exit 1; }
            done
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
